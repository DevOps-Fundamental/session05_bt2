<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <rect width="940" height="540" fill="rgb(15, 23, 42)" rx="8"/>
  <rect width="940" height="38" fill="rgb(30, 41, 59)" rx="8"/>
  <circle cx="20" cy="19" r="6" fill="rgb(239, 68, 68)"/>
  <circle cx="38" cy="19" r="6" fill="rgb(245, 158, 11)"/>
  <circle cx="56" cy="19" r="6" fill="rgb(34, 197, 94)"/>
  <text x="310" y="24" fill="rgb(148, 163, 184)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12">Interactive Rebase Editor: git-rebase-todo (Nano)</text>

  <g font-family="Courier New, Consolas, monospace" font-size="13">
    <!-- Active instructions header -->
    <text x="24" y="65" fill="#38bdf8" font-weight="bold">=== GIT INTERACTIVE REBASE TODO LIST ===</text>

    <!-- Line 1: pick commit 1 -->
    <rect x="20" y="80" width="900" height="32" rx="4" fill="rgba(34, 197, 94, 0.15)"/>
    <text x="35" y="101" fill="#22c55e" font-weight="bold">pick  </text>
    <text x="95" y="101" fill="#f59e0b">a1b2c3d</text>
    <text x="180" y="101" fill="#f8fafc">feat: khoi tao module auth</text>
    <text x="650" y="101" fill="#94a3b8">[Giu commit goc]</text>

    <!-- Line 2: squash commit 2 -->
    <rect x="20" y="120" width="900" height="32" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="35" y="141" fill="#38bdf8" font-weight="bold">squash</text>
    <text x="95" y="141" fill="#f59e0b">b2c3d4e</text>
    <text x="180" y="141" fill="#f8fafc">fix typo</text>
    <text x="650" y="141" fill="#38bdf8">[Gop vao commit truoc]</text>

    <!-- Line 3: squash commit 3 -->
    <rect x="20" y="160" width="900" height="32" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="35" y="181" fill="#38bdf8" font-weight="bold">squash</text>
    <text x="95" y="181" fill="#f59e0b">c3d4e5f</text>
    <text x="180" y="181" fill="#f8fafc">adds utility functions</text>
    <text x="650" y="181" fill="#38bdf8">[Gop vao commit truoc]</text>

    <!-- Line 4: drop commit 4 -->
    <rect x="20" y="200" width="900" height="32" rx="4" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="35" y="221" fill="#ef4444" font-weight="bold">drop  </text>
    <text x="95" y="221" fill="#f59e0b">d4e5f6a</text>
    <text x="180" y="221" fill="#f8fafc">add temp file for debug</text>
    <text x="650" y="221" fill="#ef4444">[Xoa bo commit rac]</text>

    <!-- Help commands in editor -->
    <line x1="24" y1="250" x2="910" y2="250" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="275" fill="#64748b">Commands:</text>
    <text x="24" y="300" fill="#94a3b8">p, pick &lt;commit&gt; = use commit</text>
    <text x="24" y="322" fill="#94a3b8">r, reword &lt;commit&gt; = use commit, but edit the commit message</text>
    <text x="24" y="344" fill="#94a3b8">e, edit &lt;commit&gt; = use commit, but stop for amending</text>
    <text x="24" y="366" fill="#38bdf8" font-weight="bold">s, squash &lt;commit&gt; = use commit, but meld into previous commit</text>
    <text x="24" y="388" fill="#94a3b8">f, fixup &lt;commit&gt; = like "squash", but discard this commit's log message</text>
    <text x="24" y="410" fill="#ef4444" font-weight="bold">d, drop &lt;commit&gt; = remove commit</text>

    <!-- Commit message edit prompt -->
    <rect x="20" y="445" width="900" height="70" rx="6" fill="rgba(30, 41, 59, 0.8)" stroke="#f59e0b" stroke-width="1"/>
    <text x="35" y="470" fill="#f59e0b" font-weight="bold">Thong diep commit moi sau khi gop:</text>
    <text x="35" y="495" fill="#22c55e" font-weight="bold">feat: hoan thien module authentication</text>
  </g>
</svg>
